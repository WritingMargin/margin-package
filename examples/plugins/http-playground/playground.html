<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>API playground</title><style>
*{box-sizing:border-box}body{margin:0;padding:24px;font:14px/1.6 system-ui,sans-serif;background:var(--background,#fff);color:var(--foreground,#252820)}h2{font-size:20px;margin:0 0 8px}p{color:var(--muted,#666)}label{display:block;font-weight:600}textarea,pre{width:100%;min-height:120px;padding:16px;border:1px solid var(--border,#ddd);border-radius:8px;background:transparent;color:inherit;font:13px/1.6 monospace;white-space:pre-wrap;overflow-wrap:anywhere}button{padding:10px 18px;border:1px solid var(--border,#ddd);border-radius:8px;background:var(--accent,#788765);color:#fff;font:inherit;cursor:pointer}button:disabled{opacity:.5}#error{color:#b42318}
</style></head><body><h2>Try the API</h2><p id="hint">Send a request and explore the response.</p><label>Request JSON<textarea id="input" spellcheck="false" maxlength="60000"></textarea></label><button id="send" type="button">Send request</button><p id="error" role="alert"></p><pre id="output" aria-live="polite">The response will appear here.</pre>
<script type="module">
/*SDK*/
const client=await connectBlock();
const input=document.querySelector('#input'),button=document.querySelector('#send'),error=document.querySelector('#error'),output=document.querySelector('#output');
for(const [key,value] of Object.entries(client.context.theme))if(typeof value==='string')document.documentElement.style.setProperty('--'+key,value);
input.value=client.context.source||'{}';
if(client.context.mode==='edit')document.querySelector('#hint').textContent='Choose the starting JSON for readers. The owner configures the service and reader permission in plugin settings.';
function readInput(){const value=JSON.parse(input.value);if(!value||typeof value!=='object'||Array.isArray(value))throw new Error('Enter a JSON object.');return value;}
input.addEventListener('input',()=>{error.textContent='';try{readInput();if(client.context.mode==='edit')client.change(input.value);}catch(err){error.textContent=err.message;}});
button.addEventListener('click',async()=>{button.disabled=true;error.textContent='';try{const result=await client.action('api.request',readInput());output.textContent=JSON.stringify(result,null,2);}catch(err){error.textContent=err.message;}finally{button.disabled=false;}});
new ResizeObserver(()=>client.resize(document.documentElement.scrollHeight)).observe(document.body);
window.addEventListener('pagehide',()=>client.close(),{once:true});
</script></body></html>
