name: Validate plugin directory
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node scripts/validate-catalog.mjs
      - run: python3 -m unittest discover -s examples/plugins/python-notebook -p test_build_package.py
      - run: npm ci --prefix examples/plugins/python-notebook
      - run: npm ci --prefix examples/plugins/three-scene
      - run: node --test packages/plugin-sdk/*.test.mjs
      - run: npm test --prefix examples/plugins/python-notebook
      - run: npm test --prefix examples/plugins/three-scene
      - run: npm test --prefix examples/plugins/http-playground
